keys:
  target_direction:
    label: 目标方向
    aliases: [求职方向, 意向方向, 目标岗位, 求职目标]
  cities:
    label: 城市
    aliases: [地点, 地区, 工作地, 意向城市]
    examples: [北京, 上海, 广州, 深圳, 杭州, 南京, 苏州, 成都, 武汉, 西安, 重庆, 天津, 长沙, 合肥, 宁波]
  excluded_types:
    label: 排除的岗位或公司类型
    aliases: [岗位类型, 公司类型, 排除类型, 排除, 不投, 不考虑]
  job_notes:
    label: 其他求职偏好
    aliases: [求职备注, 求职偏好, 其他偏好]
  tone:
    label: 语气
    aliases: [文风, 写作语气, 写作风格]
    values:
      平实: [朴实一点, 朴实, 别太花哨, 平实些]
      简洁有力: [简练有力, 写得利落]
  bullet_length:
    label: 每条长度
    aliases: [条目长度, 简历长度, 行数, 每条]
    values:
      尽量一行: [尽可能一行, 一行内, 一行以内]
      不超过两行: [最多两行, 两行以内, 两行内]
      不限: [不限制长度, 行数不限]
  tech_terms:
    label: 技术名写法
    aliases: [技术名, 技术术语, 术语, 技术名称]
    values:
      英文原名: [保留英文, 用英文]
      中文: [用中文, 中文写法]
      中英并列: [中英对照, 中英文都写]
phrases:
  lasting: [以后, 今后, 往后, 长期, 默认, 我偏好, 记住, 记一下, 保存, 总是, 一律]
  negative: [不要, 不想, 不用, 不必, 不再, 不接受, 不考虑, 不喜欢, 不是, 别, 禁止, 拒绝, 无需]
  add: [加上, 加入, 增加, 添加, 补上, 也行, 也可以, 也接受, 也考虑]
  remove: [删, 去掉, 移除, 取消, 不再, 不要, 别再, 不考虑, 不投]
  replace: [改成, 改为, 换成, 替换, 更新为, 只要, 只考虑, 只选, 只留, 覆盖, 重新设]
  clear: [忘掉, 忘记, 清空, 清除, 删掉, 删除, 别再记, 不要再记]
  keep: [不要删, 别删, 不用删, 不能删, 不许删, 别忘, 不要忘, 不用忘, 不要清, 别清, 不要移除, 别移除]
