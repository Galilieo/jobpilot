# 求职条件与教育程序比对用的规则词表，由 services/criteria_match.py 读取。
# 规则、等级、单位放数据文件，代码只写解析和比对逻辑。

# 学历等级：从低到高，rank 越大等级越高。
degree_levels:
  - code: associate
    label: 大专
    rank: 1
    words: [大专, 专科, 高职]
  - code: bachelor
    label: 本科
    rank: 2
    words: [统招本科, 本科, 学士, 本科学历]
  - code: master
    label: 硕士
    rank: 3
    words: [硕士研究生, 硕士, 研究生]
  - code: phd
    label: 博士
    rank: 4
    words: [博士研究生, 博士]

# 就读状态词。
education_status_words:
  enrolled: [在读生, 在校生, 在读, 在校, 在籍]
  completed: [已毕业, 已取得]

# 标明该小句为加分/优先条件，不作为硬性门槛。
preferred_markers: [优先考虑, 优先, 加分, 更佳, plus, prefer]

# 比较词：从长到短匹配。
gte_markers: [及以上, 以上, 不少于, 不低于, 至少, 起, ">=", "≥", "+"]
range_separators: ["～", "~", "—", "-", "至", "到"]

# 维度识别词：判断是否涉及求职条件或教育，以及是否属于可忽略的填充词。
onsite_cues: [每周, 到岗, 出勤, 天/周, 天／周, 一周]
months_cues: [实习期, 实习时长, 连续实习, 个月, 月以上, 半年, 一年]
education_cues: [学历, 大专, 专科, 高职, 本科, 学士, 硕士, 研究生, 博士, 在读, 在校, 应届, 毕业]

# 中文数字（用于解析「每周四天」「连续实习三个月」「半年」）。
chinese_numbers:
  一: 1
  二: 2
  两: 2
  三: 3
  四: 4
  五: 5
  六: 6
  七: 7
  八: 8
  九: 9
  十: 10
  十一: 11
  十二: 12
  半年: 6
  一年: 12

# 只包含这些补充说明词的剩余小句，不视为混入技术/经历的复合要求。
filler_clauses:
  - 可投
  - 即可
  - 均可

# 这些词只组成条件表达，专业、届别、提前到岗等仍需模型核对。
education_modifiers: [学历]
education_review_cues: [全日制, 统招]
schedule_modifiers: [可以, 可, 需, 须, 要求, 实习]
