# 依据检查第二层用的词表，services/grounding_rules.py 读取。
# 改动这里会同时影响事实拆分的转述检查（角色词）和依据检查，改完跑全量测试。

# 角色词：参与 < 负责 < 主导。改写里角色词的等级不能高于引用事实的 responsibility。
# 同一位置能匹配多个词时取最长的，所以「负责人」不会被当成「负责」。
role_levels:
  lead: [主导, 牵头, 带领, 主持, 负责人]
  own: [负责, 独立完成, 独立负责, 独立开发, 独立实现, 承担]
  participate: [参与, 协助, 配合]

# 程度词：从低到高。改写的最高等级不能高于引用事实文本里的最高等级。
degree_levels:
  - name: 了解
    words: [了解, 接触过, 入门]
  - name: 熟悉
    words: [熟悉]
  - name: 熟练
    words: [熟练, 熟练掌握, 掌握, 擅长]
  - name: 精通
    words: [精通, 深入掌握, 深度掌握]

# 引用的事实里一个程度词都没有时，改写最多能用到哪一级。
# 「用 Redis 缓存热点数据」改写成「熟悉 Redis」算合理概括，「精通 Redis」就是升级。
unstated_degree_max: 熟悉

# 数字后面的单位归一。没列出的单位（个、条、人、次……）都算计数，计数之间可以互换。
# 百分比、倍数、时间单位必须和事实里的一致：30% 不能靠事实里的「30 人」通过。
number_units:
  "%": "%"
  "％": "%"
  倍: x
  x: x
  X: x
  ms: ms
  毫秒: ms
  s: s
  秒: s
  min: min
  分钟: min
  h: h
  小时: h
  天: d
  周: week
  个月: month
  月: calendar_month  # 「3 月」是三月，不是三个月；与 grounding.py 的年月识别一致
  年: year
  万: 万
  w: 万
  W: 万
  千: k
  k: k
  K: k
  亿: 亿

# 事实里写在这些量词或单位前面的中文数字会转成阿拉伯数字，加入「依据里有的数字」：
# 事实写「两种表头」，改写写「2 种表头」不算编造。改写里的中文数字不检查，交给第三层。
chinese_classifiers: [个, 种, 家, 条, 人, 名, 位, 次, 遍, 组, 类, 张, 项, 批, 轮, 套, 款, 门, 所, 届, 级, 台, 件, 页, 份, 节, 场, 篇, 本, 行, 处, 层, 端, 倍, 万, 千, 天, 日, 周, 个月, 月, 年, 小时, 分钟, 秒, 毫秒]
